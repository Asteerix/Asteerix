name: Generate Snake Animation

# Ce fichier publie: il ecrit la branche d'artefact `output`, que le README sert
# par URL brute. Il porte donc un groupe de concurrence sans annulation, comme
# tout workflow de publication: une execution planifiee et une execution manuelle
# qui se recouvrent pousseraient la meme branche en meme temps.

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: snake-output
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3.5.0
        with:
          github_user_name: Asteerix
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#6C63FF&color_dots=#e8e0ff,#c4b5fd,#a78bfa,#8b5cf6,#6C63FF

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@1d6ee9b181a81033a16bd707a1401afa978daab4 # v5.0.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
