# Groupe et espace les mises a jour: une PR par ecosysteme et par mois au lieu
# d'une PR par paquet et par jour. Les alertes de securite ne passent pas par
# ces limites, elles restent immediates.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    groups:
      toutes-dependances:
        patterns:
          - "*"
